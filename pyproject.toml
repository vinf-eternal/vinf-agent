[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vinf-agent"
version = "0.2.0"
description = "Vinf Agent · 个人认知外延系统（开源版）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
vinf-agent = "vinf_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
