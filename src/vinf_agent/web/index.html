<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vinf Agent · 个人认知外延系统</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #14171c; color: #e6e8ec; display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 12px 20px; border-bottom: 1px solid #262b33; background: #1a1e26;
    display: flex; align-items: baseline; gap: 12px;
  }
  header h1 { font-size: 16px; margin: 0; }
  header .sub { color: #8b93a1; font-size: 12px; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 75%; padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; line-height: 1.5; }
  .msg.user { align-self: flex-end; background: #2b5fd9; }
  .msg.assistant { align-self: flex-start; background: #232833; }
  .evt { align-self: flex-start; color: #8b93a1; font-size: 12px; }
  footer { padding: 12px 20px; border-top: 1px solid #262b33; background: #1a1e26; display: flex; gap: 10px; }
  #input {
    flex: 1; background: #232833; color: #e6e8ec; border: 1px solid #333b47;
    border-radius: 8px; padding: 10px 14px; outline: none; resize: none; font-size: 14px;
  }
  #send {
    background: #2b5fd9; color: #fff; border: none; border-radius: 8px; padding: 0 22px;
    font-size: 14px; cursor: pointer;
  }
  #send:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <h1>Vinf Agent</h1>
  <span class="sub" id="status">连接中…</span>
</header>
<div id="chat"></div>
<footer>
  <textarea id="input" rows="1" placeholder="输入消息…（Enter 发送，Shift+Enter 换行）"></textarea>
  <button id="send">发送</button>
</footer>
<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const statusEl = document.getElementById("status");

async function fetchStatus() {
  try {
    const r = await fetch("/api/status");
    const j = await r.json();
    statusEl.textContent = `模型 ${j.model} · 配置 ${j.sources.length} 个`;
  } catch (e) { statusEl.textContent = "连接失败"; }
}
fetchStatus();

function addMsg(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
function addEvt(text) {
  const div = document.createElement("div");
  div.className = "evt";
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  addMsg("user", text);
  input.value = "";
  sendBtn.disabled = true;
  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    const j = await r.json();
    if (j.events && j.events.length) {
      for (const e of j.events) {
        if (e.type === "tool_call_start") addEvt(`[工具] ${(e.data.names || []).join(", ")}`);
        if (e.type === "tool_result") {
          const ok = e.data.ok ? "" : " 失败";
          addEvt(`[工具结果] ${e.data.tool}${ok}`);
        }
      }
    }
    if (j.error) addEvt(`[错误] ${j.error}`);
    else if (j.response) addMsg("assistant", j.response);
  } catch (e) {
    addEvt("[网络错误] " + e.message);
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener("click", send);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
</script>
</body>
</html>
